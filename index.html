// =========================================================
// CALCULAR TOTAL DE UN CAMPO
//
// Solo considera:
// 1. Filas visibles después del filtrado
// 2. Registros cuyo activo === true
// =========================================================

function calcularTotalCampo(campo) {

    let total = 0;


    /*
     * Obtener solamente las filas que están
     * activas/visibles después de los filtros
     */
    const filas = tabla.getRows("active");


    filas.forEach(row => {

        const registro = row.getData();


        /*
         * El registro debe estar activo
         */
        if (registro.activo !== true) {
            return;
        }


        /*
         * Obtener valor numérico
         */
        const valor = Number(
            registro[campo]
        );


        /*
         * Evitar NaN
         */
        if (!Number.isNaN(valor)) {

            total += valor;

        }

    });


    return total;
}

function checkboxFormatter(cell) {


    const row = cell.getRow();

    const data = row.getData();


    /*
     * Crear checkbox
     */

    const checkbox =
        document.createElement("input");


    checkbox.type = "checkbox";

    checkbox.className =
        "checkbox-registro";


    checkbox.checked =
        data.activo === true;


    /*
     * Cuando cambia
     */

    checkbox.addEventListener(
        "change",
        function(event) {


            /*
             * Evitar que el clic
             * seleccione la fila
             */

            event.stopPropagation();


            /*
             * Actualizar el JSON
             */

            row.update({

                activo: this.checked

            });


            /*

            tabla.redraw(true);

    );

}

function actualizarPuntos() {

    const filas = tabla.getRows("active").map(row => row.getData());

    const puntosPosibles = filas.length * 3;

    let puntosAlcanzados = 0;

    filas.forEach(fila => {
        const valor = Number(fila.flag);

        if (!Number.isNaN(valor)) {
            puntosAlcanzados += valor;
        }
    });

    const rendimiento = puntosPosibles > 0
        ? (puntosAlcanzados / puntosPosibles) * 100
        : 0;

    const parrafo = document.getElementById("puntos");

    parrafo.textContent =
        `${puntosAlcanzados} de ${puntosPosibles} puntos posibles: ${rendimiento.toFixed(2)}% de rendimiento.`;

// =========================================================
// BÚSQUEDA GENERAL
//
// Ejemplos:
//
// >40
// <40
// >=40
// <=40
// 40
// Juan
// Bogotá
// =========================================================

document
    .getElementById("busqueda")
    .addEventListener(
        "input",
        function() {

            const texto =
                this.value
                    .trim()
                    .toLowerCase();


            // =================================================
            // SIN BÚSQUEDA
            // =================================================

            if (texto === "") {

                tabla.clearFilter();

                return;

            }


            // =================================================
            // BÚSQUEDA GENERAL
            // =================================================

            tabla.setFilter(function(data) {


                // ---------------------------------------------
                // Si parece una comparación numérica
                // ---------------------------------------------

                const esComparacion =
                    /^(>=|<=|>|<)\s*-?\d+(?:\.\d+)?$/.test(
                        texto
                    );


                let operador = null;
                let numero = null;


                if (esComparacion) {

                    const coincidencia =
                        texto.match(
                            /^(>=|<=|>|<)\s*(-?\d+(?:\.\d+)?)$/
                        );


                    operador =
                        coincidencia[1];

                    numero =
                        Number(coincidencia[2]);

                }


                // =================================================
                // RECORRER CAMPOS
                // =================================================

                return Object.entries(data)
                    .some(([campo, valor]) => {


                        // -----------------------------------------
                        // CAMPO NUMÉRICO
                        // -----------------------------------------

                        if (
                            camposNumericos.includes(campo)
                        ) {


                            const valorNumerico =
                                Number(valor);


                            if (
                                Number.isNaN(
                                    valorNumerico
                                )
                            ) {

                                return false;

                            }


                            // -------------------------------------
                            // Comparación numérica
                            // -------------------------------------

                            if (esComparacion) {


                                switch (operador) {

                                    case ">":
                                        return valorNumerico > numero;

                                    case "<":
                                        return valorNumerico < numero;

                                    case ">=":
                                        return valorNumerico >= numero;

                                    case "<=":
                                        return valorNumerico <= numero;

                                }

                            }


                            // -------------------------------------
                            // Número exacto
                            // -------------------------------------

                            if (
                                /^-?\d+(?:\.\d+)?$/.test(texto)
                            ) {

                                return (
                                    valorNumerico ===
                                    Number(texto)
                                );

                            }

                        }


                        // -----------------------------------------
                        // CAMPOS DE TEXTO
                        // -----------------------------------------

                        return String(valor)
                            .toLowerCase()
                            .includes(texto);

                    });

            });

        }
    );

document
    .getElementById("btnAgregarRegistro")
    .addEventListener("click", function() {

        const nuevoRegistro = {};

        /*
         * Recorrer todas las columnas existentes
         */
        Object.keys(datos[0]).forEach(campo => {

            /*
             * ID
             */
            if (campo === "id") {

                nuevoRegistro[campo] =
                    Date.now();

                return;
            }


            /*
             * Campo activo
             */
            if (campo === "activo") {

                nuevoRegistro[campo] =
                    true;

                return;
            }


            /*
             * Campo numérico
             */
            if (camposNumericos.includes(campo)) {

                nuevoRegistro[campo] = 0;

                return;
            }


            /*
             * Campo no numérico
             */
            nuevoRegistro[campo] =
                "sin datos";

        });


        /*
         * Agregar a la tabla
         */
        tabla.addRow(
            nuevoRegistro,
            true
        );


        /*
         * Actualizar totales
         */
        tabla.redraw(true);

    });

document
    .getElementById("btnEliminarRegistro")
    .addEventListener("click", function() {

        const filas = tabla.getRows();

        let eliminados = 0;

        filas.forEach(row => {

            const data = row.getData();

            if (data.activo === true) {

                eliminados++;

            }

        });


        if (eliminados === 0) {

            alert("No hay registros seleccionados.");

            return;

        }


        const confirmar = confirm(
            "¿Está seguro de eliminar " +
            eliminados +
            " registro(s)?"
        );


        if (!confirmar) {

            return;

        }


        filas.forEach(row => {

            const data = row.getData();

            if (data.activo === true) {

                row.delete();

            }

        });


        tabla.redraw(true);

    });





// =========================================================
// FILTRO DE COLUMNA
// Permite:
//
// >40
// <40
// >=40
// <=40
// 40
// =========================================================

function filtroColumna(headerValue, rowValue, rowData, filterParams) {

    const texto = String(headerValue).trim();

    // Si no hay filtro, mostrar todo
    if (texto === "") {
        return true;
    }


    // =====================================================
    // ¿ES UN CAMPO NUMÉRICO?
    // =====================================================

    if (camposNumericos.includes(filterParams.campo)) {

        const valor = Number(rowValue);

        if (Number.isNaN(valor)) {
            return false;
        }


        // =================================================
        // >=
        // =================================================

        if (texto.startsWith(">=")) {

            const numero = Number(
                texto.substring(2).trim()
            );

            return !Number.isNaN(numero)
                && valor >= numero;
        }


        // =================================================
        // <=
        // =================================================

        if (texto.startsWith("<=")) {

            const numero = Number(
                texto.substring(2).trim()
            );

            return !Number.isNaN(numero)
                && valor <= numero;
        }


        // =================================================
        // >
        // =================================================

        if (texto.startsWith(">")) {

            const numero = Number(
                texto.substring(1).trim()
            );

            return !Number.isNaN(numero)
                && valor > numero;
        }


        // =================================================
        // <
        // =================================================

        if (texto.startsWith("<")) {

            const numero = Number(
                texto.substring(1).trim()
            );

            return !Number.isNaN(numero)
                && valor < numero;
        }


        // =================================================
        // IGUAL
        // =================================================

        const numero = Number(texto);

        if (!Number.isNaN(numero)) {

            return valor === numero;

        }

    }


    // =====================================================
    // CAMPOS DE TEXTO
    // =====================================================

    return String(rowValue)
        .toLowerCase()
        .includes(texto.toLowerCase());

}

function colorearFila(row) {

    const data = row.getData();
    const flag = Number(data.flag);
    const elemento = row.getElement();

    elemento.style.setProperty(
        "background-color",
        "",
        "important"
    );

    if (flag === 1) {
        elemento.style.setProperty(
            "background-color",
            "#f00",
            "important"
        );
    }
    else if (flag === 2) {
        elemento.style.setProperty(
            "background-color",
            "#fff7b0",
            "important"
        );
    }
    else if (flag === 3) {
        elemento.style.setProperty(
            "background-color",
            "#b9ffd5",
            "important"
        );
    }


}

async function subirJSONaGitHub(json) {

    const owner = "pbotg";
    const repo = "pbotg";
    const archivo = "pbotg.json";
    var token_hash = "RzW8aoqKiopPrOsF2NsYDNpZTs8HJh+oKIJMCjcHqZ6R/si9O4Mi97N6AjrmYxC4vW3pOmFNwgajbhZi85jP07f9OHO7gxHOrOXYwidHlvfMoVQedBW8/uWfbVcTaj682Go7VFw=";
    var token = "";

    if( __CLAVE__.length==0 ){


                    __clave = prompt("Clave de guardado:");


                    if (!__clave) {
                        alert("clave inválida!");
                        return;
                    }



                    token = $7.decrypt( token_hash, __clave ) // 

                    }
                else{
                    token = $7.decrypt( token_hash, __CLAVE__ )
                    }




    // -----------------------------------------
    // 1. Obtener SHA del archivo actual
    // -----------------------------------------

    const respuestaArchivo = await fetch(
        `https://api.github.com/repos/${owner}/${repo}/contents/${archivo}`,
        {
            headers: {
                "Accept": "application/vnd.github+json",
                "Authorization": `Bearer ${token}`,
                "X-GitHub-Api-Version": "2026-03-10"
            }
        }
    );

    if (!respuestaArchivo.ok) {
        throw new Error(
            "No se pudo obtener el archivo: " +
            respuestaArchivo.status
        );
    }

    const archivoGitHub = await respuestaArchivo.json();

    const sha = archivoGitHub.sha;


    // -----------------------------------------
    // 2. Convertir JSON a Base64
    // -----------------------------------------

    const contenidoBase64 = btoa(
        unescape(
            encodeURIComponent(json)
        )
    );


    // -----------------------------------------
    // 3. Reemplazar archivo
    // -----------------------------------------

    const respuesta = await fetch(
        `https://api.github.com/repos/${owner}/${repo}/contents/${archivo}`,
        {
            method: "PUT",

            headers: {
                "Accept": "application/vnd.github+json",
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json",
                "X-GitHub-Api-Version": "2026-03-10"
            },

            body: JSON.stringify({

                message: "Actualizar pbotg.json",

                content: contenidoBase64,

                sha: sha

            })
        }
    );


    if (!respuesta.ok) {

        const error = await respuesta.text();

        throw new Error(
            "GitHub rechazó la actualización: " +
            error
        );
    }


    return await respuesta.json();
}
